name: Docker Build, and Test

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build-test-connect:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Create .env.prod
      run: |
        printf 'THETADATA_API_KEY=%s\nTHETA_ENV=PROD\nBASE_URL=http://127.0.0.1:25500\n' \
          "${{ secrets.THETADATA_API_KEY }}" > .env.prod

    - name: Build and test
      run: |
        make build
        make test
        
    - name: Check logs on failure
      if: failure()
      run: docker compose logs
      
    - name: Cleanup
      if: always()
      run: make down
